    <div class="tooltip-desc" id="tt-desc"></div>
  </div>

  <p class="map-hint au d2"><span class="map-hint-dot"></span>Sélectionnez un bâtiment en surbrillance</p>

    <p class="legend-title">Légende</p>
    <p class="legend-row"><span class="legend-swatch sw-project"></span>Bâtiments du projet</p>
    <p class="legend-row"><span class="legend-swatch sw-building"></span>Autres bâtiments</p>
    <p class="legend-row"><span class="legend-swatch sw-road"></span>Voirie</p>

  </div>

  <!-- PANNEAU LATÉRAL -->
  <div class="side-panel" id="side-panel">
    <div class="sp-inner">
      <div class="sp-top">
        <span class="sp-eyebrow" id="sp-eyebrow"></span>
        <button class="sp-close" id="sp-close" aria-label="Fermer">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
            <line x1="1.5" y1="1.5" x2="8.5" y2="8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="8.5" y1="1.5" x2="1.5" y2="8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <h2 class="sp-title" id="sp-title"></h2>
      <p class="sp-subtitle" id="sp-subtitle"></p>
      <div class="sp-rule"></div>
      <p class="sp-desc" id="sp-desc"></p>
      <div class="sp-stats" id="sp-stats"></div>
      <div class="sp-fin" id="sp-fin"></div>
      <div class="sp-tags" id="sp-tags"></div>
      <div class="sp-cta" id="sp-cta"></div>
    </div>
  </div>

  <!-- BOUSSOLE -->
  <div class="compass au d4">
    <svg width="34" height="34" viewBox="0 0 36 36">
      <polygon points="18,4 14,18 18,16 22,18" fill="var(--accent)"/>
      <polygon points="18,32 14,18 18,20 22,18" fill="var(--muted-l)"/>
      <circle cx="18" cy="18" r="2.5" fill="var(--fg)"/>
      <text x="18" y="10" text-anchor="middle" font-size="6" fill="var(--accent)" font-weight="500">N</text>
    </svg>
  </div>
